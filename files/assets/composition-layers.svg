    <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="65" font-size="16" fill="#75786d" text-anchor="start">MCLARY / PHOTOGRAPHY NOTES</text><text x="48" y="117" font-size="36" fill="#292c2b" text-anchor="start">用距离建立层次，用取舍整理背景</text><text x="48" y="155" font-size="19" fill="#75786d" text-anchor="start">先移动机位，再考虑虚化；留意四角与主体边缘。</text>
    <rect x="93" y="208" width="774" height="342" rx="2" fill="#dce5df" stroke="#656d68" stroke-width="3"/><path d="M93 430.3L286.5 310.6L480.0 423.46000000000004L712.2 327.7L867 396.1V550H93Z" fill="#aebeb0"/><path d="M93 481.6Q480.0 413.2 867 471.34000000000003V550H93Z" fill="#7b9688"/><path d="M93 550V354Q181 366 239 465L272 550Z" fill="#3d6555"/><path d="M867 550V409Q751 426 704 550Z" fill="#3d6555"/><circle cx="480" cy="376" r="20" fill="#b64438" stroke="#b64438" stroke-width="3"/><rect x="465" y="396" width="30" height="68" rx="5" fill="#b64438" stroke="#b64438" stroke-width="3"/><text x="190" y="504" font-size="24" fill="#faf7ec" text-anchor="middle">前景</text><text x="545" y="421" font-size="22" fill="#b64438" text-anchor="start">主体 / 中景</text><text x="727" y="270" font-size="24" fill="#292c2b" text-anchor="start">背景</text><text x="480" y="590" font-size="22" fill="#292c2b" text-anchor="middle">换一个高度，移开重叠，让每一层有存在的理由。</text><path d="M48 617L912 617" fill="none" stroke="#75786d" stroke-width="1" stroke-dasharray=""/><text x="48" y="647" font-size="15" fill="#75786d" text-anchor="start">概念示意 · 非器材规格或实拍效果</text><text x="912" y="647" font-size="15" fill="#75786d" text-anchor="end">FIELD GUIDE / 01</text></g></svg>