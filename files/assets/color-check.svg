<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#bdc9bf" stroke-width=".6"/></pattern></defs><rect width="960" height="680" fill="#eeeede"/><rect x="24" y="24" width="912" height="632" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="64" font-size="16" fill="#69796e" text-anchor="start">MCLARY / COLOR STUDIES</text><text x="48" y="116" font-size="36" fill="#25342f" text-anchor="start">用实际内容检验配色</text><text x="48" y="156" font-size="19" fill="#69796e" text-anchor="start">比较文字、图片与状态，不只比较大色块。</text><rect x="67" y="210" width="360" height="362" rx="3" fill="#e3dfcc" stroke="#25342f" stroke-width="2"/><rect x="87" y="230" width="320" height="52" rx="6" fill="#2d554b" stroke="none" stroke-width="2"/><text x="105" y="265" font-size="19" fill="#f3efe1" text-anchor="start">COLOR NOTES</text><rect x="91" y="301" width="270" height="7" rx="6" fill="#536b5f" stroke="none" stroke-width="2"/><rect x="91" y="325" width="245" height="7" rx="6" fill="#536b5f" stroke="none" stroke-width="2"/><rect x="91" y="349" width="270" height="7" rx="6" fill="#536b5f" stroke="none" stroke-width="2"/><rect x="91" y="507" width="113" height="38" rx="6" fill="#c57148" stroke="none" stroke-width="2"/><text x="147" y="532" font-size="16" fill="#fff" text-anchor="middle">了解更多</text><circle cx="493" cy="251" r="19" fill="#087f6b" stroke="none" stroke-width="3"/><text x="493" y="258" font-size="15" fill="#fff" text-anchor="middle">01</text><text x="527" y="258" font-size="21" fill="#25342f" text-anchor="start">正文与背景是否容易分辨？</text><circle cx="493" cy="341" r="19" fill="#087f6b" stroke="none" stroke-width="3"/><text x="493" y="348" font-size="15" fill="#fff" text-anchor="middle">02</text><text x="527" y="348" font-size="21" fill="#25342f" text-anchor="start">重要信息是否只有一个重点？</text><circle cx="493" cy="431" r="19" fill="#087f6b" stroke="none" stroke-width="3"/><text x="493" y="438" font-size="15" fill="#fff" text-anchor="middle">03</text><text x="527" y="438" font-size="21" fill="#25342f" text-anchor="start">去掉颜色后，含义还清楚吗？</text><circle cx="493" cy="521" r="19" fill="#087f6b" stroke="none" stroke-width="3"/><text x="493" y="528" font-size="15" fill="#fff" text-anchor="middle">04</text><text x="527" y="528" font-size="21" fill="#25342f" text-anchor="start">同类元素是否使用一致颜色？</text><path d="M48 618L912 618" fill="none" stroke="#69796e" stroke-width="1" stroke-dasharray=""/><text x="48" y="649" font-size="15" fill="#69796e" text-anchor="start">学习示意 · 实际观感受设备、背景与观看环境影响</text><text x="912" y="649" font-size="15" fill="#69796e" text-anchor="end">COLOR / FIELD NOTES</text></g></svg>