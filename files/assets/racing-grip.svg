<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>纵向与横向，共享同一份抓地</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8e8dc" opacity=".07"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#ed794b"/></marker></defs><rect width="1000" height="700" fill="#202d30"/><rect width="1000" height="700" fill="url(#grid)"/><g font-family="'Microsoft YaHei',sans-serif"><text x="44" y="48" font-size="16" fill="#ece9dc" >MCLARY / PIT WALL</text><text x="955" y="48" font-size="16" fill="#ed794b" text-anchor="end">01 / GRIP</text><path d="M44 70H956" fill="none" stroke="#627073" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="65" y="125" font-size="31" fill="#ece9dc" >THE GRIP BUDGET</text><circle cx="330" cy="357" r="183" fill="#304648" stroke="#9cb8ad" stroke-width="2"/><path d="M110 357H550M330 135V582" fill="none" stroke="#768787" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M330 357L466 257" fill="none" stroke="#ed794b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M330 357H466V257" fill="none" stroke="#e5c44f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="466" cy="257" r="7" fill="#fff4cc"/><text x="352" y="171" font-size="18" fill="#ece9dc" >制动</text><text x="352" y="568" font-size="18" fill="#ece9dc" >加速</text><text x="480" y="394" font-size="18" fill="#ece9dc" >转向</text><text x="660" y="252" font-size="28" fill="#ece9dc" >不是三个开关，</text><text x="660" y="295" font-size="28" fill="#ece9dc" >而是一次分配。</text><text x="660" y="369" font-size="21" fill="#e5c44f" >横向需求增加</text><text x="660" y="408" font-size="21" fill="#ed794b" >纵向余量减少</text><text x="660" y="505" font-size="18" fill="#a0aeb0" >轮胎与条件变化时，</text><text x="660" y="539" font-size="18" fill="#a0aeb0" >实际边界也会变化。</text><path d="M44 636H956" fill="none" stroke="#627073" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="674" font-size="17" fill="#ece9dc" >纵向与横向，共享同一份抓地</text><text x="956" y="674" font-size="15" fill="#a0aeb0" text-anchor="end">概念示意 · 非实测数据</text></g></svg>