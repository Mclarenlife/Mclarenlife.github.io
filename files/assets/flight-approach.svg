<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>稳定进近是状态组合，不只看接地</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c9e0e8" opacity=".08"/></pattern><marker id="tip" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#e5b174" stroke-width="1"/></marker><clipPath id="dial"><circle cx="365" cy="350" r="197"/></clipPath></defs><rect width="1000" height="700" fill="#21475f"/><rect width="1000" height="700" fill="url(#grid)"/><g font-family="'Microsoft YaHei',sans-serif"><text x="45" y="48" font-size="16" fill="#dfebec" >MCLARY / FLIGHT STUDIES</text><text x="955" y="48" font-size="16" fill="#e5b174" text-anchor="end">05 / APPROACH</text><path d="M45 70H955" fill="none" stroke="#7294a4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M65 488H940" fill="none" stroke="#99b6c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="673" y="470" width="265" height="18" fill="#b1c4c6"/><path d="M90 192L737 470" fill="none" stroke="#e5b174" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M90 151L737 470M90 233L737 470" fill="none" stroke="#769aad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 9"/><circle cx="737" cy="470" r="8" fill="#e5b174"/><text x="72" y="129" font-size="29" fill="#dfebec" >提前建立稳定状态</text><text x="610" y="547" font-size="25" fill="#e5b174" >瞄准点 ≠ 接地点</text><rect x="112" y="561" width="145" height="43" fill="#345f77"/><text x="184" y="590" font-size="19" fill="#dfebec" text-anchor="middle">路径</text><rect x="292" y="561" width="145" height="43" fill="#345f77"/><text x="364" y="590" font-size="19" fill="#dfebec" text-anchor="middle">速度</text><rect x="472" y="561" width="145" height="43" fill="#345f77"/><text x="544" y="590" font-size="19" fill="#dfebec" text-anchor="middle">构型</text><rect x="652" y="561" width="145" height="43" fill="#345f77"/><text x="724" y="590" font-size="19" fill="#dfebec" text-anchor="middle">工作负荷</text><text x="480" y="227" font-size="24" fill="#dfebec" >不满足适用标准时，</text><text x="480" y="271" font-size="24" fill="#dfebec" >按程序选择复飞。</text><text x="80" y="521" font-size="17" fill="#b4cbd3" >无比例、无通用下滑角或速度设定</text><path d="M45 634H955" fill="none" stroke="#7294a4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="45" y="672" font-size="17" fill="#dfebec" >稳定进近是状态组合，不只看接地</text><text x="955" y="672" font-size="15" fill="#b4cbd3" text-anchor="end">教学示意 · 非运行图表</text></g></svg>