<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#bdc9bf" stroke-width=".6"/></pattern></defs><rect width="960" height="680" fill="#eeeede"/><rect x="24" y="24" width="912" height="632" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="64" font-size="16" fill="#69796e" text-anchor="start">MCLARY / COLOR STUDIES</text><text x="48" y="116" font-size="36" fill="#25342f" text-anchor="start">从随机试模式，到有目的地选择</text><text x="48" y="156" font-size="19" fill="#69796e" text-anchor="start">每次只改一个变量，保留修改前后的对照。</text><rect x="60" y="236" width="260" height="251" rx="6" fill="#315e60" stroke="none" stroke-width="2"/><text x="190" y="296" font-size="29" fill="#fff" text-anchor="middle">01</text><text x="190" y="361" font-size="29" fill="#fff" text-anchor="middle">先定目标</text><text x="190" y="418" font-size="17" fill="#fff" text-anchor="middle">压暗 / 提亮 / 对比</text><rect x="360" y="236" width="260" height="251" rx="6" fill="#6d5bb6" stroke="none" stroke-width="2"/><text x="490" y="296" font-size="29" fill="#fff" text-anchor="middle">02</text><text x="490" y="361" font-size="29" fill="#fff" text-anchor="middle">再选运算</text><text x="490" y="418" font-size="17" fill="#fff" text-anchor="middle">模式 / 顺序 / 透明度</text><rect x="660" y="236" width="260" height="251" rx="6" fill="#a45055" stroke="none" stroke-width="2"/><text x="790" y="296" font-size="29" fill="#fff" text-anchor="middle">03</text><text x="790" y="361" font-size="29" fill="#fff" text-anchor="middle">最后复核</text><text x="790" y="418" font-size="17" fill="#fff" text-anchor="middle">颜色空间 / 输出条件</text><text x="480" y="561" font-size="22" fill="#087f6b" text-anchor="middle">记录条件，才能重现结果；RGB 算法不等于颜料配方。</text><path d="M48 618L912 618" fill="none" stroke="#69796e" stroke-width="1" stroke-dasharray=""/><text x="48" y="649" font-size="15" fill="#69796e" text-anchor="start">学习示意 · 实际观感受设备、背景与观看环境影响</text><text x="912" y="649" font-size="15" fill="#69796e" text-anchor="end">COLOR / FIELD NOTES</text></g></svg>