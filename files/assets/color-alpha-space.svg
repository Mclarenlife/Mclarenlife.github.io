<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#bdc9bf" stroke-width=".6"/></pattern></defs><rect width="960" height="680" fill="#eeeede"/><rect x="24" y="24" width="912" height="632" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="64" font-size="16" fill="#69796e" text-anchor="start">MCLARY / COLOR STUDIES</text><text x="48" y="116" font-size="36" fill="#25342f" text-anchor="start">相同权重，不同的运算空间</text><text x="48" y="156" font-size="19" fill="#69796e" text-anchor="start">左：直接平均 sRGB 编码值；右：线性光平均后编码回 sRGB。</text><rect x="76" y="229" width="373" height="259" rx="6" fill="#808080" stroke="none" stroke-width="2"/><rect x="511" y="229" width="373" height="259" rx="6" fill="#bcbcbc" stroke="none" stroke-width="2"/><text x="263" y="536" font-size="22" fill="#25342f" text-anchor="middle">编码数值平均：#808080</text><text x="697" y="536" font-size="22" fill="#25342f" text-anchor="middle">线性光平均：约 #BCBCBC</text><text x="480" y="586" font-size="23" fill="#087f6b" text-anchor="middle">黑白各占 50%；“一半”取决于计算空间。</text><path d="M48 618L912 618" fill="none" stroke="#69796e" stroke-width="1" stroke-dasharray=""/><text x="48" y="649" font-size="15" fill="#69796e" text-anchor="start">学习示意 · 实际观感受设备、背景与观看环境影响</text><text x="912" y="649" font-size="15" fill="#69796e" text-anchor="end">COLOR / FIELD NOTES</text></g></svg>